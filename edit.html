<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程管理後台 // Schedule Hub Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 31, 0.9);
            --neon-blue: #00f5d4;
            --neon-purple: #7b2cbf;
            --rog-red: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-line: rgba(0, 245, 212, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景 Canvas 粒子 */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ROG G16 頂部動態光條 */
        .rog-top-bar {
            height: 4px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(90deg, var(--rog-red), var(--neon-blue), var(--neon-purple), var(--rog-red));
            background-size: 300% 100%;
            animation: rogStream 5s linear infinite, rogBreathing 3s ease-in-out infinite alternate;
        }

        @keyframes rogStream {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        @keyframes rogBreathing {
            0% { box-shadow: 0 0 8px rgba(0, 245, 212, 0.4); }
            100% { box-shadow: 0 0 22px rgba(255, 0, 85, 0.8); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .sys-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
            margin-bottom: 8px;
        }

        /* 導航列 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--bg-card);
            padding: 12px 20px;
            border: 1px solid var(--border-line);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }

        .cyber-link-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line);
            cursor: pointer;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: all 0.2s ease;
        }

        .cyber-link-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-primary);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* 機甲切角卡片 */
        .cyber-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 25px;
            margin-bottom: 25px;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            backdrop-filter: blur(10px);
            transition: border-color 0.3s;
        }

        .cyber-card:hover {
            border-color: var(--neon-blue);
        }

        .cyber-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 表單與輸入框 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-family: 'Orbitron', sans-serif;
        }

        .cyber-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-line);
            color: #fff;
            font-family: monospace;
            font-size: 0.95ln;
            outline: none;
            transition: border-color 0.3s;
        }

        .cyber-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }

        /* 電競龐克主按鈕 */
        .cyber-btn {
            width: 100%;
            padding: 14px;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--bg-primary);
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
            margin-top: 10px;
        }

        .cyber-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--neon-blue);
            background: linear-gradient(135deg, #fff, var(--neon-blue));
        }

        .cyber-btn-alt {
            background: rgba(255, 0, 85, 0.15);
            color: var(--rog-red);
            border: 1px solid var(--rog-red);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .cyber-btn-alt:hover {
            background: var(--rog-red);
            color: #fff;
            box-shadow: 0 0 25px var(--rog-red);
        }

        /* 狀態提示與代號顯示區 */
        .code-display-box {
            background: rgba(0, 245, 212, 0.05);
            border: 1px dashed var(--neon-blue);
            padding: 15px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .code-display-box span {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: var(--neon-blue);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .msg-box {
            padding: 12px;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
            border-left: 3px solid var(--rog-red);
            background: rgba(255, 0, 85, 0.1);
            color: #ff88a5;
        }
    </style>
</head>
<body>

    <div class="rog-top-bar"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <header>
            <div class="sys-title">SCHEDULE EDITOR</div>
        </header>

        <div class="nav-bar">
            <a href="index.html" class="cyber-link-btn">← 回首頁 HOME</a>
            <a href="view.html" class="cyber-link-btn">前往前台檢視 VIEW →</a>
        </div>

        <!-- 認證與分享代號設定卡片 -->
        <div class="cyber-card">
            <h3>🔐 試算表連結與專屬代號生成</h3>
            <div class="form-group">
                <label class="form-label">Google 試算表完整網址或 ID</label>
                <input type="text" id="sheetInput" class="cyber-input" placeholder="https://docs.google.com/spreadsheets/d/...">
            </div>
            <div class="form-group">
                <label class="form-label">安全存取密碼 (A1 儲存格密碼)</label>
                <input type="password" id="passInput" class="cyber-input" placeholder="••••">
            </div>

            <button class="cyber-btn" onclick="loadDashboard()">載入 / 登入行程表</button>
            <button class="cyber-btn cyber-btn-alt" onclick="generateShareCode()">生成專屬分享代號與連結</button>

            <div id="msgBox" class="msg-box"></div>

            <div id="codeBox" class="code-display-box">
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px;">您的專屬行程分享代號：</p>
                <span id="shareCodeText"></span>
                <p style="color: var(--neon-blue); font-size: 0.8rem; margin-top: 8px;">已自動複製分享連結至剪貼簿！</p>
            </div>
        </div>

        <!-- 編輯與批量生成控制台 (載入後解鎖) -->
        <div id="editorContent" style="display: none;">
            <div class="cyber-card">
                <h3>⚡ 行程快速新增</h3>
                <div class="form-group">
                    <label class="form-label">日期 (YYYY-MM-DD)</label>
                    <input type="date" id="newDate" class="cyber-input">
                </div>
                <div class="form-group">
                    <label class="form-label">行程標題與內容</label>
                    <input type="text" id="newTitle" class="cyber-input" placeholder="例：APCS 刷題練習">
                </div>
                <button class="cyber-btn" onclick="addSingleSchedule()">確認新增單筆行程</button>
            </div>
        </div>
    </div>

    <script>
        // 背景粒子
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        const particles = [];
        for(let i=0; i<30; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, color: Math.random()>0.5?'#00f5d4':'#ff0055'});
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
                if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=0.5; ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();

        // 核心邏輯：生成分享代號
        function generateShareCode() {
            const sheet = document.getElementById('sheetInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const msgBox = document.getElementById('msgBox');
            const codeBox = document.getElementById('codeBox');

            if (!sheet || !pass) {
                msgBox.style.display = 'block';
                msgBox.textContent = "警告：請先填入試算表網址與密碼，才能生成分享代號！";
                return;
            }
            msgBox.style.display = 'none';

            // 提取 Sheet ID
            let sheetId = sheet;
            if (sheet.includes('/d/')) {
                const match = sheet.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (match) sheetId = match[1];
            }

            // 加密成代號
            const rawData = sheetId + "|||" + pass;
            const code = btoa(encodeURIComponent(rawData));
            
            // 產生分享連結
            const link = window.location.origin + "/view.html?code=" + code;

            document.getElementById('shareCodeText').textContent = code;
            codeBox.style.display = 'block';

            // 複製到剪貼簿
            navigator.clipboard.writeText(link).then(() => {
                console.log("Link copied!");
            });
        }

        function loadDashboard() {
            const sheet = document.getElementById('sheetInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const msgBox = document.getElementById('msgBox');

            if (!sheet || !pass) {
                msgBox.style.display = 'block';
                msgBox.textContent = "請完整輸入試算表網址與密碼。";
                return;
            }
            msgBox.style.display = 'none';
            // 模擬解鎖進入編輯器
            document.getElementById('editorContent').style.display = 'block';
            alert("試算表連線成功！後台編輯控制台已解鎖。");
        }

        function addSingleSchedule() {
            alert("（示範）單筆行程已準備寫入試算表。");
        }
    </script>
</body>
</html>
