<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全防護行程儀表板 // Schedule Hub View</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 31, 0.88);
            --neon-blue: #00f5d4;
            --neon-purple: #7b2cbf;
            --rog-red: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-line: rgba(0, 245, 212, 0.2);
            --today-glow: rgba(0, 245, 212, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .rog-top-bar {
            height: 4px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(90deg, var(--rog-red), var(--neon-blue), var(--neon-purple), var(--rog-red));
            background-size: 300% 100%;
            animation: rogStream 5s linear infinite, rogBreathing 3s ease-in-out infinite alternate;
        }

        @keyframes rogStream {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        @keyframes rogBreathing {
            0% { box-shadow: 0 0 8px rgba(0, 245, 212, 0.4); }
            100% { box-shadow: 0 0 22px rgba(255, 0, 85, 0.8); }
        }

        /* --- 密碼鎖防護罩樣式 --- */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(15px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--neon-blue);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: 0 0 30px rgba(0, 245, 212, 0.2);
        }

        .auth-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .auth-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-line);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .auth-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: var(--bg-primary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .auth-error {
            color: var(--rog-red);
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 20px;
        }

        /* --- 主畫面樣式 --- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .sys-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
            margin-bottom: 8px;
        }

        .status-bar {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 18px var(--neon-blue); }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .schedule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 20px 25px;
            margin-bottom: 18px;
            position: relative;
            backdrop-filter: blur(10px);
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            transition: all 0.3s ease;
        }

        .schedule-card:hover {
            border-color: var(--neon-blue);
            transform: translateX(4px);
            box-shadow: -4px 0 20px rgba(0, 245, 212, 0.2);
        }

        .schedule-card.is-today {
            border-color: var(--neon-blue);
            background: rgba(0, 245, 212, 0.06);
            box-shadow: 0 0 20px var(--today-glow);
        }

        .schedule-card.is-today::before {
            content: 'TODAY';
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--bg-primary);
            background: var(--neon-blue);
            padding: 2px 8px;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .schedule-card.is-done {
            opacity: 0.45;
            filter: grayscale(0.6);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .card-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .cyber-link-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
        }

        .cyber-link-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-primary);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .loading-state {
            text-align: center;
            padding: 50px 0;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- 密碼鎖防護罩 -->
    <div id="authOverlay">
        <div class="auth-box">
            <h2>RESTRICTED AREA</h2>
            <p>請輸入安全存取密碼以解鎖行程資料庫</p>
            <input type="password" id="passInput" class="auth-input" placeholder="••••">
            <button class="auth-btn" onclick="verifyPassword()">UNLOCK ACCESS</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div class="rog-top-bar"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="main-wrapper">
        <header>
            <div class="sys-title">SCHEDULE DASHBOARD</div>
            <div class="status-bar">
                <div class="pulse-dot"></div>
                <span>SYSTEM SECURED // ENCRYPTED LINK</span>
            </div>
        </header>

        <div class="nav-bar">
            <a href="index.html" class="cyber-link-btn">← 回首頁 HOME</a>
            <a href="edit.html" class="cyber-btn cyber-link-btn">進入後台 EDIT</a>
        </div>

        <div id="scheduleContainer">
            <div class="loading-state">
                WAITING FOR AUTHENTICATION...
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔐 設定你的專屬密碼與 Google API 網址
        // ==========================================
        const MY_SECURE_PASSWORD = "0414"; // <-- 你可以改成你自己的密碼！
        const API_URL = "YOUR_GAS_API_URL_HERE"; // <-- 填入你另一個帳號的 GAS 部署網址

        // 檢查是否已經解鎖過
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isUnlocked') === 'true') {
                document.getElementById('authOverlay').style.display = 'none';
                fetchSchedules();
            }
        });

        function verifyPassword() {
            const inputVal = document.getElementById('passInput').value;
            const errorDiv = document.getElementById('authError');

            if (inputVal === MY_SECURE_PASSWORD) {
                sessionStorage.setItem('isUnlocked', 'true');
                document.getElementById('authOverlay').style.display = 'none';
                fetchSchedules();
            } else {
                errorDiv.textContent = "ACCESS DENIED: 密碼錯誤，請重新輸入";
                document.getElementById('passInput').value = '';
            }
        }

        // 按 Enter 鍵直接解鎖
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });

        // --- Canvas 背景粒子動畫 ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? '#00f5d4' : '#ff0055',
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // --- 行程資料讀取與渲染邏輯 ---
        async function fetchSchedules() {
            const container = document.getElementById('scheduleContainer');
            
            if (!API_URL || API_URL === "YOUR_GAS_API_URL_HERE") {
                renderData([
                    { date: getTodayString(), title: "（安全防護模式範例）請綁定您的 GAS API", desc: "當您填入真實 API 網址後將顯示您的專屬行程", done: false }
                ]);
                return;
            }

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderData(data);
            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<div class="loading-state" style="color: var(--rog-red);">DATA CONNECTION FAILED</div>`;
            }
        }

        function renderData(list) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="loading-state">NO SCHEDULED EVENTS FOUND</div>`;
                return;
            }

            const todayStr = getTodayString();
            list.sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return new Date(a.date) - new Date(b.date);
            });

            list.forEach(item => {
                const isToday = (item.date === todayStr);
                const card = document.createElement('div');
                card.className = `schedule-card ${isToday ? 'is-today' : ''} ${item.done ? 'is-done' : ''}`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-date">📅 ${item.date}</div>
                    </div>
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${item.desc ? `<div class="card-desc">${escapeHtml(item.desc)}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function getTodayString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
