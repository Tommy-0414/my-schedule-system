<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程檢視儀表板 // Schedule Hub View</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 31, 0.9);
            --neon-blue: #00f5d4;
            --neon-purple: #7b2cbf;
            --rog-red: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-line: rgba(0, 245, 212, 0.25);
            --today-glow: rgba(0, 245, 212, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }

        .rog-top-bar {
            height: 4px; width: 100%; position: fixed; top: 0; left: 0; z-index: 100;
            background: linear-gradient(90deg, var(--rog-red), var(--neon-blue), var(--neon-purple), var(--rog-red));
            background-size: 300% 100%;
            animation: rogStream 5s linear infinite, rogBreathing 3s ease-in-out infinite alternate;
        }

        @keyframes rogStream { 0% { background-position: 0% 0%; } 100% { background-position: 300% 0%; } }
        @keyframes rogBreathing { 0% { box-shadow: 0 0 8px rgba(0, 245, 212, 0.4); } 100% { box-shadow: 0 0 22px rgba(255, 0, 85, 0.8); } }

        .container {
            position: relative; z-index: 10; max-width: 900px; margin: 0 auto; padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 30px; }

        .sys-title {
            font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3); margin-bottom: 8px;
        }

        .nav-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
            background: var(--bg-card); padding: 12px 20px; border: 1px solid var(--border-line);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }

        .cyber-link-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif; font-size: 0.9rem; color: var(--text-main);
            text-decoration: none; padding: 8px 16px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line); cursor: pointer;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: all 0.2s ease;
        }

        .cyber-link-btn:hover { background: var(--neon-blue); color: var(--bg-primary); box-shadow: 0 0 15px var(--neon-blue); }

        .schedule-card {
            background: var(--bg-card); border: 1px solid var(--border-line); padding: 20px 25px;
            margin-bottom: 18px; position: relative;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            transition: all 0.3s ease;
        }

        .schedule-card:hover { border-color: var(--neon-blue); transform: translateX(4px); box-shadow: -4px 0 20px rgba(0, 245, 212, 0.2); }

        .schedule-card.is-today {
            border-color: var(--neon-blue); background: rgba(0, 245, 212, 0.06); box-shadow: 0 0 20px var(--today-glow);
        }

        .schedule-card.is-today::before {
            content: 'TODAY'; position: absolute; top: 10px; right: 15px;
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 800;
            color: var(--bg-primary); background: var(--neon-blue); padding: 2px 8px;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .card-date { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--neon-blue); margin-bottom: 8px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .card-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }

        .loading-state { text-align: center; padding: 40px 0; color: var(--neon-blue); font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="rog-top-bar"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <header>
            <div class="sys-title">SCHEDULE DASHBOARD</div>
        </header>

        <div class="nav-bar">
            <a href="index.html" class="cyber-link-btn">← 回首頁 HOME</a>
            <a href="edit.html" class="cyber-link-btn">前往後台 EDIT</a>
        </div>

        <div id="scheduleContainer">
            <div class="loading-state">LOADING SCHEDULE STREAMS...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        const particles = [];
        for(let i=0; i<30; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, color: Math.random()>0.5?'#00f5d4':'#ff0055'});
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
                if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.color; ctx.globalAlpha=0.5; ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();

        window.addEventListener('DOMContentLoaded', () => {
            const sheetUrl = localStorage.getItem('user_sheet_url');
            const container = document.getElementById('scheduleContainer');

            if (!sheetUrl) {
                // 若尚未在後台連線過，顯示友善指引與 Demo 資料
                renderList([
                    { date: getTodayString(), title: "🚀 歡迎使用 Schedule Hub", desc: "請先至後台 (EDIT) 輸入您的試算表與密碼完成連線，即可在此安全檢視您的專屬行程！", done: false }
                ]);
            } else {
                // 模擬已連線成功讀取資料
                renderList([
                    { date: getTodayString(), title: "中興大學 AI 營隊與備審進度", desc: "正在同步您的雲端試算表資料...", done: false },
                    { date: getOffsetDate(1), title: "APCS 模擬測試", desc: "觀念題與實作題刷題訓練", done: false }
                ]);
            }
        });

        function renderList(list) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';
            const todayStr = getTodayString();

            list.forEach(item => {
                const isToday = (item.date === todayStr);
                const card = document.createElement('div');
                card.className = `schedule-card ${isToday ? 'is-today' : ''}`;
                card.innerHTML = `
                    <div class="card-date">📅 ${item.date}</div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>
                `;
                container.appendChild(card);
            });
        }

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        }
        function getOffsetDate(offset) {
            const now = new Date();
            now.setDate(now.getDate() + offset);
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        }
    </script>
</body>
</html>
