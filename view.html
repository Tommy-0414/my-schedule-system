<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程檢視</title>
    
    <meta name="google-site-verification" content="feYZwWmybw27udFEJd154-BeEnWnfxf_vQOWfjUI1c0" />
    <meta name="description" content="這是一個超方便的線上行程表系統，可以輕鬆建立、分享並追蹤你的任務與旅行計畫！">
    <meta name="keywords" content="行程表, 任務管理, 旅遊規劃, 自由行行程, 排行程工具, 待辦事項">
    <meta property="og:title" content="我的專屬行程管理系統">
    <meta property="og:description" content="快來看看這個超方便的免費行程管理小工具！">
    <meta property="og:type" content="website">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #080c14; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Canvas 背景 */
        #space-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; 
        }

        /* 檢視端主卡片 */
        .card { 
            background: rgba(11, 19, 36, 0.94); 
            backdrop-filter: blur(25px);
            padding: 35px; 
            border-radius: 24px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8); 
            max-width: 600px; 
            width: 100%;
            z-index: 10;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: fadeInCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-sizing: border-box;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; /* 為了流光加載條 */
        }

        /* ⚡ 頂部流光加載條 */
        .loading-bar {
            position: absolute;
            top: 0; left: 0;
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #00f5d4, #007bff, #00f5d4, transparent);
            background-size: 200% 100%;
            animation: streamBar 1.5s linear infinite;
            transition: opacity 0.5s ease;
        }

        @keyframes streamBar {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 當資料載入完成，觸發量子綠脈衝外發光 */
        .card.loaded-glow {
            border-color: #00f5d4 !important;
            box-shadow: 0 0 40px rgba(0, 245, 212, 0.35), 0 25px 60px rgba(0,0,0,0.9) !important;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            color: #ffffff; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 1.7rem; 
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        
        /* 載入中動畫樣式 */
        .loading { 
            text-align: center; 
            color: #00f5d4; 
            margin-top: 25px; 
            font-weight: bold;
            font-family: monospace;
            font-size: 1.1rem;
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.5);
            animation: loadingPulse 1.2s infinite alternate;
        }

        @keyframes loadingPulse {
            0% { opacity: 0.4; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.01); }
        }

        /* 表格結構改裝 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #cbd5e1; }
        th { padding: 14px; border-bottom: 2px solid rgba(255, 255, 255, 0.15); text-align: left; color: #ffffff; font-weight: 600; }
        td { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left; transition: all 0.25s; }
        
        /* ✨ 行程表登場動畫與悬停微互動 */
        #schedule-table {
            animation: tableReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes tableReveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        tr:hover td { 
            background: rgba(0, 245, 212, 0.04); 
            color: #ffffff;
            border-bottom-color: rgba(0, 245, 212, 0.3);
        }

        /* ✨ 今日未完成行程的專屬霓虹高亮效果 */
        tr.today-highlight td {
            background: rgba(0, 245, 212, 0.08) !important;
            border-bottom: 1px solid rgba(0, 245, 212, 0.6) !important;
            color: #00f5d4 !important;
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.4);
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { background: rgba(0, 245, 212, 0.06); }
            50% { background: rgba(0, 245, 212, 0.14); }
        }

        /* 已完成的文字劃掉與淡化 */
        .completed-text { 
            text-decoration: line-through; 
            color: #64748b !important; 
            opacity: 0.6;
        }

        /* 狀態標籤 - 量子綠完成 */
        .status-badge { 
            font-size: 0.85em; 
            padding: 5px 10px; 
            border-radius: 8px; 
            background: rgba(16, 185, 129, 0.12); 
            color: #10b981; 
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-weight: bold; 
            text-shadow: 0 0 5px rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }
        
        /* 狀態標籤 - 未完成 */
        .status-pending { 
            font-size: 0.85em; 
            padding: 5px 10px; 
            border-radius: 8px; 
            background: rgba(255, 255, 255, 0.04); 
            color: #94a3b8; 
            border: 1px solid rgba(255, 255, 255, 0.12);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- ☄️ 機械錶星空背景 -->
    <canvas id="space-canvas"></canvas>

    <div class="card" id="main-card">
        <!-- ⚡ 數據流加載條 -->
        <div class="loading-bar" id="top-loading-bar"></div>
        
        <h2 id="page-title">📅 行程檢視</h2>
        <div id="content">
            <div class="loading" id="status">[ CONNECTING_QUANTUM_DATA... ]</div>
            <table id="schedule-table" style="display:none;">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>行程</th>
                        <th style="text-align: center;">狀態</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const endpoint = "https://script.google.com/macros/s/AKfycbyWKLOOj9U6dYx1xDupEvDIxkwHZL4tYg8Y7ZaSRfLgMYEkeyQfxXFSxZt5ljSmIHyixw/exec";

        async function fetchSchedule() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const statusDiv = document.getElementById('status');
            const card = document.getElementById('main-card');
            const loadingBar = document.getElementById('top-loading-bar');

            if (!id) {
                if(loadingBar) loadingBar.style.opacity = '0';
                statusDiv.style.color = '#f87171';
                statusDiv.style.textShadow = '0 0 8px rgba(248, 113, 113, 0.5)';
                return statusDiv.innerText = "錯誤：找不到行程 ID，請確認連結是否正確。";
            }

            try {
                const response = await fetch(`${endpoint}?id=${id}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // 精準保留你原本的標題抓取邏輯
                const customTitle = data[0][1] || '📅 行程表';
                document.getElementById('page-title').innerText = customTitle;
                document.title = customTitle; 

                // 取得今天日期的 YYYY-MM-DD 格式，用來比對高亮
                const todayStr = new Date().toISOString().substring(0, 10);

                // 🚀 將原始橫列資料結構化並進行「分流與時間軸排序」
                const formattedRows = data.slice(1).map(row => {
                    if (row[0] === "" && row[1] === "") return null;
                    
                    let dateDisplay = row[0] || '';
                    if (typeof dateDisplay === 'string' && dateDisplay.includes('T')) {
                        dateDisplay = dateDisplay.substring(0, 10);
                    }

                    let isCompleted = (row[2] === true || row[2] === "true" || row[2] === "TRUE");
                    
                    return {
                        originalDate: row[0] || '',
                        dateStr: dateDisplay,
                        content: row[1] || '',
                        isCompleted: isCompleted
                    };
                }).filter(row => row !== null);

                // 排序核心邏輯：未完成優先 + 時間由舊到新
                formattedRows.sort((a, b) => {
                    // 1. 先比對完成狀態 (未完成的 false 會排在已完成的 true 前面)
                    if (a.isCompleted !== b.isCompleted) {
                        return a.isCompleted ? 1 : -1;
                    }
                    
                    // 2. 如果狀態一樣，比對時間 (沒日期的排在最後面)
                    if (!a.dateStr && !b.dateStr) return 0;
                    if (!a.dateStr) return 1;
                    if (!b.dateStr) return -1;
                    
                    return new Date(a.dateStr) - new Date(b.dateStr);
                });

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                // 將排序完的資料渲染至前台
                formattedRows.forEach(item => {
                    let textClass = item.isCompleted ? "completed-text" : "";
                    let statusHtml = item.isCompleted 
                        ? '<span class="status-badge">✅ 完成</span>' 
                        : '<span class="status-pending">⬜ 未完</span>';

                    // 如果是今天且「未完成」的行程，加入特殊高亮 class
                    let rowClass = (!item.isCompleted && item.dateStr === todayStr) ? 'class="today-highlight"' : '';

                    tbody.innerHTML += `<tr ${rowClass}>
                        <td class="${textClass}">${item.dateStr}</td>
                        <td class="${textClass}">${item.content}</td>
                        <td style="text-align: center;">${statusHtml}</td>
                    </tr>`;
                });

                document.getElementById('schedule-table').style.display = 'table';
                statusDiv.style.display = 'none';
                
                // ⚡ 資料成功載入後，隱藏流光條並觸發量子綠發光
                if(loadingBar) loadingBar.style.opacity = '0';
                card.classList.add('loaded-glow');
            } catch (e) {
                if(loadingBar) loadingBar.style.opacity = '0';
                statusDiv.style.color = '#f87171';
                statusDiv.style.textShadow = '0 0 8px rgba(248, 113, 113, 0.5)';
                statusDiv.innerText = "載入失敗：" + e.message;
            }
        }
        fetchSchedule();

        // --- 🌟 機械錶風背景引擎 (與後台完美對齊且增強滑鼠連線) ---
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const mouse = { x: null, y: null, maxDistance: 240 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        const textSymbols = ['12:00', '08:30', '23:59', '[||||||..]', '[|||.....]', 'SCHEDULE', 'TIME_AXIS', 'VIEW_MODE'];
        const particlesArray = [];
        const numberOfParticles = 40;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 4 + 11; 
                this.speedX = (Math.random() - 0.5) * 0.4; 
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.2 + 0.3; 
                this.angle = Math.random() * Math.PI * 2; 
                this.rotationSpeed = Math.random() * 0.004 + 0.002;

                const rand = Math.random();
                if (rand < 0.25) { this.type = 'clock'; } 
                else if (rand < 0.5) { this.type = 'dot'; } 
                else {
                    this.type = 'text';
                    this.symbol = textSymbols[Math.floor(Math.random() * textSymbols.length)];
                }
            }
            update() {
                this.x += this.speedX; this.y += this.speedY; this.angle += this.rotationSpeed;
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.maxDistance) { this.x += dx * 0.015; this.y += dy * 0.015; }
                }
            }
            draw() {
                ctx.shadowBlur = 4; ctx.shadowColor = '#007bff';
                if (this.type === 'clock') { 
                    ctx.strokeStyle = `rgba(148, 163, 184, ${this.opacity})`; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(this.angle) * 5, this.y + Math.sin(this.angle) * 5); ctx.stroke();
                } else if (this.type === 'dot') {
                    ctx.fillStyle = `rgba(0, 245, 212, ${this.opacity * 1.2})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
                } else if (this.type === 'text') {
                    ctx.fillStyle = `rgba(148, 163, 184, ${this.opacity})`;
                    ctx.font = `bold ${this.size}px monospace`; ctx.fillText(this.symbol, this.x, this.y);
                }
                ctx.shadowBlur = 0;
            }
        }

        function init() { for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); } }
        function connectNodes() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 140) {
                        ctx.strokeStyle = `rgba(0, 123, 255, ${0.15 * (1 - distance / 140)})`; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            connectNodes(); requestAnimationFrame(animate);
        }
        init(); animate();
    </script>
</body>
</html>
