<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程檢視儀表板 // Schedule Hub View</title>
    
    <!-- 科幻字體 Orbitron 與 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 31, 0.88);
            --neon-blue: #00f5d4;
            --neon-purple: #7b2cbf;
            --rog-red: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-line: rgba(0, 245, 212, 0.2);
            --today-glow: rgba(0, 245, 212, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Canvas 背景置底 */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ROG G16 頂部動態 Aura 呼吸光條 */
        .rog-top-bar {
            height: 4px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(90deg, var(--rog-red), var(--neon-blue), var(--neon-purple), var(--rog-red));
            background-size: 300% 100%;
            animation: rogStream 5s linear infinite, rogBreathing 3s ease-in-out infinite alternate;
        }

        @keyframes rogStream {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        @keyframes rogBreathing {
            0% { box-shadow: 0 0 8px rgba(0, 245, 212, 0.4); }
            100% { box-shadow: 0 0 22px rgba(255, 0, 85, 0.8); }
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .sys-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
            margin-bottom: 8px;
        }

        .status-bar {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 18px var(--neon-blue); }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* 電競龐克機甲卡片 */
        .schedule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 20px 25px;
            margin-bottom: 18px;
            position: relative;
            backdrop-filter: blur(10px);
            clip-path: polygon(
                0 0, 
                calc(100% - 16px) 0, 
                100% 16px, 
                100% 100%, 
                16px 100%, 
                0 calc(100% - 16px)
            );
            transition: all 0.3s ease;
        }

        .schedule-card:hover {
            border-color: var(--neon-blue);
            transform: translateX(4px);
            box-shadow: -4px 0 20px rgba(0, 245, 212, 0.2);
        }

        /* 當日任務的高亮脈衝光暈 */
        .schedule-card.is-today {
            border-color: var(--neon-blue);
            background: rgba(0, 245, 212, 0.06);
            box-shadow: 0 0 20px var(--today-glow);
        }

        .schedule-card.is-today::before {
            content: 'TODAY';
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--bg-primary);
            background: var(--neon-blue);
            padding: 2px 8px;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* 已完成項目的淡化處理 */
        .schedule-card.is-done {
            opacity: 0.45;
            filter: grayscale(0.6);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .card-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 導航按鈕列 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .cyber-link-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
        }

        .cyber-link-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-primary);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .loading-state {
            text-align: center;
            padding: 50px 0;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- ROG 脈衝光邊條 -->
    <div class="rog-top-bar"></div>

    <!-- 背景 Canvas 粒子 -->
    <canvas id="bgCanvas"></canvas>

    <div class="main-wrapper">
        <header>
            <div class="sys-title">SCHEDULE DASHBOARD</div>
            <div class="status-bar">
                <div class="pulse-dot"></div>
                <span>SYSTEM ONLINE // REAL-TIME MONITORING</span>
            </div>
        </header>

        <div class="nav-bar">
            <a href="index.html" class="cyber-link-btn">← 回首頁 HOME</a>
            <a href="edit.html" class="cyber-btn cyber-link-btn">進入後台 EDIT</a>
        </div>

        <div id="scheduleContainer">
            <div class="loading-state">
                LOADING DATA STREAMS...
            </div>
        </div>
    </div>

    <script>
        // --- 1. Canvas 輕量背景粒子動畫 ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 35;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? '#00f5d4' : '#ff0055',
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // --- 2. 行程資料讀取與渲染邏輯 ---
        // 請將此處替換為你實際的 Google Apps Script API 部署網址
        const API_URL = "YOUR_GAS_API_URL_HERE"; 

        async function fetchSchedules() {
            const container = document.getElementById('scheduleContainer');
            
            if (!API_URL || API_URL === "YOUR_GAS_API_URL_HERE") {
                // 若未填寫 API 網址，顯示電競龐克 Demo 數據
                renderData([
                    { date: getTodayString(), title: "中興大學 AI 營隊說明會", desc: "線上會議：介紹專案展示與備審資料準備", done: false },
                    { date: getOffsetDateString(1), title: "APCS 模擬測試與題庫刷題", desc: "完成 3 題觀念題與 2 題實作題練習", done: false },
                    { date: getOffsetDateString(2), title: "特殊選才自傳與簡歷校對", desc: "整理獎狀與證照 PDF 檔上傳至 Google Drive", done: false },
                    { date: getOffsetDateString(-1), title: "ESP32 溫濕度感測器測試", desc: "燒錄程式碼並確認 CSV 數據正常寫入", done: true }
                ]);
                return;
            }

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderData(data);
            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<div class="loading-state" style="color: var(--rog-red);">DATA CONNECTION FAILED</div>`;
            }
        }

        function renderData(list) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="loading-state">NO SCHEDULED EVENTS FOUND</div>`;
                return;
            }

            const todayStr = getTodayString();

            // 排序邏輯：未完成優先 -> 依日期先後排序
            list.sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return new Date(a.date) - new Date(b.date);
            });

            list.forEach(item => {
                const isToday = (item.date === todayStr);
                const card = document.createElement('div');
                card.className = `schedule-card ${isToday ? 'is-today' : ''} ${item.done ? 'is-done' : ''}`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-date">📅 ${item.date}</div>
                    </div>
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${item.desc ? `<div class="card-desc">${escapeHtml(item.desc)}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // 輔助函式
        function getTodayString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getOffsetDateString(offsetDays) {
            const now = new Date();
            now.setDate(now.getDate() + offsetDays);
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 初始化讀取
        fetchSchedules();
    </script>
</body>
</html>
