<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程檢視 // Schedule Viewer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 31, 0.94);
            --neon-blue: #00f5d4;
            --neon-purple: #7b2cbf;
            --rog-red: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-line: rgba(0, 245, 212, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .rog-top-bar {
            height: 4px; width: 100%; position: fixed; top: 0; left: 0; z-index: 100;
            background: linear-gradient(90deg, var(--rog-red), var(--neon-blue), var(--neon-purple), var(--rog-red));
            background-size: 300% 100%;
            animation: rogStream 5s linear infinite, rogBreathing 3s ease-in-out infinite alternate;
        }
        @keyframes rogStream { 0% { background-position: 0% 0%; } 100% { background-position: 300% 0%; } }
        @keyframes rogBreathing { 0% { box-shadow: 0 0 8px rgba(0, 245, 212, 0.4); } 100% { box-shadow: 0 0 22px rgba(255, 0, 85, 0.8); } }

        #space-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; 
        }

        .card { 
            background: var(--bg-card); 
            backdrop-filter: blur(25px);
            padding: 35px; 
            max-width: 650px; 
            width: 100%;
            z-index: 10;
            position: relative;
            border: 1px solid var(--border-line);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: all 0.6s ease;
        }

        .loading-bar {
            position: absolute; top: 0; left: 0; height: 3px; width: 100%;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--rog-red), var(--neon-blue), transparent);
            background-size: 200% 100%;
            animation: streamBar 1.5s linear infinite;
            transition: opacity 0.5s ease;
        }

        @keyframes streamBar {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .card.loaded-glow {
            border-color: var(--neon-blue) !important;
            box-shadow: 0 0 40px rgba(0, 245, 212, 0.35), 0 25px 60px rgba(0,0,0,0.9) !important;
        }

        h2 { 
            font-family: 'Orbitron', sans-serif;
            color: #ffffff; 
            margin-top: 0; margin-bottom: 25px; 
            font-size: 1.6rem; text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }
        
        .loading { 
            text-align: center; color: var(--neon-blue); margin-top: 25px; 
            font-family: 'Orbitron', monospace; font-size: 1rem;
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.5);
            animation: loadingPulse 1.2s infinite alternate;
        }

        @keyframes loadingPulse {
            0% { opacity: 0.4; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1.01); }
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: var(--text-muted); }
        th { 
            padding: 14px; border-bottom: 2px solid var(--border-line); 
            text-align: left; color: #ffffff; font-weight: 600; 
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem;
        }
        td { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left; transition: all 0.25s; }
        
        tr:hover td { 
            background: rgba(0, 245, 212, 0.04); 
            color: #ffffff;
            border-bottom-color: rgba(0, 245, 212, 0.3);
        }

        /* 🌟 今日未完成行程高亮 */
        tr.today-highlight td {
            background: rgba(0, 245, 212, 0.08) !important;
            border-bottom: 1px solid rgba(0, 245, 212, 0.6) !important;
            color: var(--neon-blue) !important;
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.4);
            animation: pulseGlow 2s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0%, 100% { background: rgba(0, 245, 212, 0.06); }
            50% { background: rgba(0, 245, 212, 0.14); }
        }

        .completed-text { text-decoration: line-through; color: #64748b !important; opacity: 0.6; }

        .status-badge { 
            font-size: 0.8em; padding: 4px 10px; 
            background: rgba(16, 185, 129, 0.12); color: #10b981; 
            border: 1px solid rgba(16, 185, 129, 0.35); font-weight: bold; 
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(16, 185, 129, 0.3); white-space: nowrap;
        }
        
        .status-pending { 
            font-size: 0.8em; padding: 4px 10px; 
            background: rgba(255, 255, 255, 0.04); color: var(--text-muted); 
            border: 1px solid rgba(255, 255, 255, 0.12); white-space: nowrap;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>
    <div class="rog-top-bar"></div>
    <canvas id="space-canvas"></canvas>

    <div class="card" id="main-card">
        <div class="loading-bar" id="top-loading-bar"></div>
        
        <h2 id="page-title">📅 SCHEDULE VIEWER</h2>
        <div id="content">
            <div class="loading" id="status">[ CONNECTING_QUANTUM_DATA... ]</div>
            <table id="schedule-table" style="display:none;">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>行程</th>
                        <th style="text-align: center;">狀態</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const endpoint = "https://script.google.com/macros/s/AKfycbyWKLOOj9U6dYx1xDupEvDIxkwHZL4tYg8Y7ZaSRfLgMYEkeyQfxXFSxZt5ljSmIHyixw/exec";

        async function fetchSchedule() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const statusDiv = document.getElementById('status');
            const card = document.getElementById('main-card');
            const loadingBar = document.getElementById('top-loading-bar');

            if (!id) {
                if(loadingBar) loadingBar.style.opacity = '0';
                statusDiv.style.color = 'var(--rog-red)';
                return statusDiv.innerText = "錯誤：找不到行程 ID，請確認連結是否正確。";
            }

            try {
                const response = await fetch(`${endpoint}?id=${id}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                const customTitle = data[0][1] || '📅 行程表';
                document.getElementById('page-title').innerText = customTitle;
                document.title = customTitle; 

                const todayStr = new Date().toISOString().substring(0, 10);

                const formattedRows = data.slice(1).map(row => {
                    if (row[0] === "" && row[1] === "") return null;
                    let dateDisplay = row[0] || '';
                    if (typeof dateDisplay === 'string' && dateDisplay.includes('T')) {
                        dateDisplay = dateDisplay.substring(0, 10);
                    }
                    let isCompleted = (row[2] === true || row[2] === "true" || row[2] === "TRUE");
                    return {
                        originalDate: row[0] || '',
                        dateStr: dateDisplay,
                        content: row[1] || '',
                        isCompleted: isCompleted
                    };
                }).filter(row => row !== null);

                formattedRows.sort((a, b) => {
                    if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
                    if (!a.dateStr && !b.dateStr) return 0;
                    if (!a.dateStr) return 1;
                    if (!b.dateStr) return -1;
                    return new Date(a.dateStr) - new Date(b.dateStr);
                });

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                formattedRows.forEach(item => {
                    let textClass = item.isCompleted ? "completed-text" : "";
                    let statusHtml = item.isCompleted 
                        ? '<span class="status-badge">✅ 完成</span>' 
                        : '<span class="status-pending">⬜ 未完</span>';

                    let rowClass = (!item.isCompleted && item.dateStr === todayStr) ? 'class="today-highlight"' : '';

                    tbody.innerHTML += `<tr ${rowClass}>
                        <td class="${textClass}">${item.dateStr}</td>
                        <td class="${textClass}">${item.content}</td>
                        <td style="text-align: center;">${statusHtml}</td>
                    </tr>`;
                });

                document.getElementById('schedule-table').style.display = 'table';
                statusDiv.style.display = 'none';
                if(loadingBar) loadingBar.style.opacity = '0';
                card.classList.add('loaded-glow');
            } catch (e) {
                if(loadingBar) loadingBar.style.opacity = '0';
                statusDiv.style.color = 'var(--rog-red)';
                statusDiv.innerText = "載入失敗：" + e.message;
            }
        }
        fetchSchedule();

        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const mouse = { x: null, y: null, maxDistance: 240 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

        const textSymbols = ['12:00', '08:30', '23:59', '[||||||..]', '[|||.....]', 'SCHEDULE', 'TIME_AXIS'];
        const particlesArray = [];
        const numberOfParticles = 35;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 4 + 11; this.speedX = (Math.random() - 0.5) * 0.4; this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.2 + 0.3; this.angle = Math.random() * Math.PI * 2; this.rotationSpeed = Math.random() * 0.004 + 0.002;
                const rand = Math.random();
                if (rand < 0.25) this.type = 'clock'; else if (rand < 0.5) this.type = 'dot'; else { this.type = 'text'; this.symbol = textSymbols[Math.floor(Math.random() * textSymbols.length)]; }
            }
            update() {
                this.x += this.speedX; this.y += this.speedY; this.angle += this.rotationSpeed;
                if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
                if (this.y < 0 || this.y > canvas.height) this.speedY = -this.speedY;
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.maxDistance) { this.x += dx * 0.015; this.y += dy * 0.015; }
                }
            }
            draw() {
                ctx.shadowBlur = 4; ctx.shadowColor = '#00f5d4';
                if (this.type === 'clock') { 
                    ctx.strokeStyle = `rgba(148, 163, 184, ${this.opacity})`; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(this.angle) * 5, this.y + Math.sin(this.angle) * 5); ctx.stroke();
                } else if (this.type === 'dot') {
                    ctx.fillStyle = `rgba(0, 245, 212, ${this.opacity * 1.2})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
                } else if (this.type === 'text') {
                    ctx.fillStyle = `rgba(148, 163, 184, ${this.opacity})`;
                    ctx.font = `bold ${this.size}px monospace`; ctx.fillText(this.symbol, this.x, this.y);
                }
                ctx.shadowBlur = 0;
            }
        }

        function init() { for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle()); }
        function connectNodes() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 140) {
                        ctx.strokeStyle = `rgba(0, 245, 212, ${0.15 * (1 - dist / 140)})`; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
            connectNodes(); requestAnimationFrame(animate);
        }
        init(); animate();
    </script>
</body>
</html>
