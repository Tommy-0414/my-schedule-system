<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程檢視儀表板 // Schedule Hub View</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 31, 0.88);
            --neon-blue: #00f5d4;
            --neon-purple: #7b2cbf;
            --rog-red: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-line: rgba(0, 245, 212, 0.2);
            --today-glow: rgba(0, 245, 212, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .rog-top-bar {
            height: 4px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(90deg, var(--rog-red), var(--neon-blue), var(--neon-purple), var(--rog-red));
            background-size: 300% 100%;
            animation: rogStream 5s linear infinite, rogBreathing 3s ease-in-out infinite alternate;
        }

        @keyframes rogStream {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        @keyframes rogBreathing {
            0% { box-shadow: 0 0 8px rgba(0, 245, 212, 0.4); }
            100% { box-shadow: 0 0 22px rgba(255, 0, 85, 0.8); }
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .sys-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
            margin-bottom: 8px;
        }

        /* 導航列與按鈕 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--bg-card);
            padding: 12px 20px;
            border: 1px solid var(--border-line);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }

        .cyber-link-btn {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-line);
            cursor: pointer;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: all 0.2s ease;
        }

        .cyber-link-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-primary);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* 設定面板卡片 */
        .setup-card {
            background: var(--bg-card);
            border: 1px solid var(--neon-blue);
            padding: 30px;
            margin-bottom: 25px;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.15);
        }

        .setup-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            margin-bottom: 12px;
            font-size: 1.2rem;
        }

        .setup-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .api-input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .api-input {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-line);
            color: #fff;
            font-family: monospace;
            font-size: 0.95rem;
            outline: none;
        }

        .api-input:focus {
            border-color: var(--neon-blue);
        }

        /* 行程卡片 */
        .schedule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 20px 25px;
            margin-bottom: 18px;
            position: relative;
            backdrop-filter: blur(10px);
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            transition: all 0.3s ease;
        }

        .schedule-card:hover {
            border-color: var(--neon-blue);
            transform: translateX(4px);
            box-shadow: -4px 0 20px rgba(0, 245, 212, 0.2);
        }

        .schedule-card.is-today {
            border-color: var(--neon-blue);
            background: rgba(0, 245, 212, 0.06);
            box-shadow: 0 0 20px var(--today-glow);
        }

        .schedule-card.is-today::before {
            content: 'TODAY';
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--bg-primary);
            background: var(--neon-blue);
            padding: 2px 8px;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .schedule-card.is-done {
            opacity: 0.45;
            filter: grayscale(0.6);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .card-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-blue);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .loading-state {
            text-align: center;
            padding: 40px 0;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="rog-top-bar"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="main-wrapper">
        <header>
            <div class="sys-title">SCHEDULE DASHBOARD</div>
        </header>

        <!-- 頂部導航列：包含回首頁與設定按鈕 -->
        <div class="nav-bar">
            <a href="index.html" class="cyber-link-btn">← 回首頁 HOME</a>
            <div>
                <button class="cyber-link-btn" onclick="toggleSettings()">⚙️ 設定資料庫 API</button>
                <a href="edit.html" class="cyber-link-btn" style="margin-left: 8px;">進入後台 EDIT</a>
            </div>
        </div>

        <!-- API 設定區塊（預設隱藏或若無設定時自動顯示） -->
        <div id="setupCard" class="setup-card" style="display: none;">
            <h3>🔗 連接您的 Google 試算表後端</h3>
            <p>這是一個開源的行程管理前端工具。請輸入您的 Google Apps Script 網頁應用程式網址以載入行程（資料僅會儲存在您自己的瀏覽器中，安全保密）。</p>
            <div class="api-input-group">
                <input type="text" id="apiUrlInput" class="api-input" placeholder="https://script.google.com/macros/s/.../exec">
                <button class="cyber-link-btn" onclick="saveApiUrl()" style="background: var(--neon-blue); color: var(--bg-primary);">儲存並載入</button>
            </div>
        </div>

        <div id="scheduleContainer">
            <div class="loading-state">
                LOADING SCHEDULE STREAMS...
            </div>
        </div>
    </div>

    <script>
        // --- 背景粒子動畫 ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? '#00f5d4' : '#ff0055',
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // --- 核心邏輯：從 LocalStorage 讀取使用者的 API 網址 ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('user_gas_api_url');
            if (!savedUrl) {
                // 如果沒有設定過，顯示設定卡片並帶入預設 Demo 資料
                document.getElementById('setupCard').style.display = 'block';
                renderData([
                    { date: getTodayString(), title: "歡迎使用 Schedule Hub 公開排程系統", desc: "請點擊上方「設定資料庫 API」按鈕，填入您自己的 Google Apps Script 網址來載入您的行程！", done: false }
                ]);
            } else {
                fetchSchedules(savedUrl);
            }
        });

        function toggleSettings() {
            const card = document.getElementById('setupCard');
            card.style.display = card.style.display === 'none' ? 'block' : 'none';
            const savedUrl = localStorage.getItem('user_gas_api_url');
            if (savedUrl) {
                document.getElementById('apiUrlInput').value = savedUrl;
            }
        }

        function saveApiUrl() {
            const url = document.getElementById('apiUrlInput').value.trim();
            if (!url) {
                alert("請輸入有效的 API 網址！");
                return;
            }
            localStorage.setItem('user_gas_api_url', url);
            document.getElementById('setupCard').style.display = 'none';
            fetchSchedules(url);
        }

        async function fetchSchedules(url) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = `<div class="loading-state">CONNECTING TO DATABASE...</div>`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderData(data);
            } catch (err) {
                console.error("Fetch Error:", err);
                container.innerHTML = `<div class="loading-state" style="color: var(--rog-red);">CONNECTION FAILED // 請檢查 API 網址是否正確</div>`;
            }
        }

        function renderData(list) {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="loading-state">NO SCHEDULED EVENTS FOUND</div>`;
                return;
            }

            const todayStr = getTodayString();
            list.sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return new Date(a.date) - new Date(b.date);
            });

            list.forEach(item => {
                const isToday = (item.date === todayStr);
                const card = document.createElement('div');
                card.className = `schedule-card ${isToday ? 'is-today' : ''} ${item.done ? 'is-done' : ''}`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-date">📅 ${item.date}</div>
                    </div>
                    <div class="card-title">${escapeHtml(item.title)}</div>
                    ${item.desc ? `<div class="card-desc">${escapeHtml(item.desc)}</div>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function getTodayString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
